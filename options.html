<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>NDM – Skip Sites (fixwithyuvi edition)</title>
<style>
body{font-family:Segoe UI,Arial,sans-serif;max-width:560px;margin:30px auto;padding:0 16px;color:#222}
h1{font-size:20px;display:flex;align-items:center;gap:8px}
p{color:#555;font-size:13px;line-height:1.5}
.row{display:flex;gap:8px;margin:14px 0}
input{flex:1;padding:8px;font-size:14px;border:1px solid #aaa;border-radius:4px}
button{padding:8px 14px;font-size:14px;border:0;border-radius:4px;background:#2eaa4a;color:#fff;cursor:pointer}
button.del{background:#d33;padding:4px 10px;font-size:12px}
ul{list-style:none;padding:0;margin:0}
li{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-bottom:1px solid #ddd}
#empty{color:#888;font-size:13px;padding:8px 10px}
#msg{color:#c00;font-size:12px;min-height:16px}
</style></head><body>
<h1><img src="img/icon48.png" width="28" height="28"> NeatDownloadManager – Skip Sites</h1>
<div style="color:#2eaa4a;font-weight:bold;font-size:13px;margin-top:-6px">fixwithyuvi edition</div>
<p>NDM will not catch downloads or show its video panel on these sites (subdomains included).
Example: <b>example.com</b> also covers <b>files.example.com</b>.</p>
<div class="row"><input id="site" placeholder="example.com" autofocus><button id="add">Add</button></div>
<div id="msg"></div>
<ul id="list"></ul><div id="empty">No sites skipped yet.</div>
<script src="options.js"></script>
</body></html>
